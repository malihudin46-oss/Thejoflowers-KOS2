<svg width="40" height="40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="petalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F6B6A5;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#F7D74C;stop-opacity:0.8" />
    </linearGradient>
    <radialGradient id="centerGradient">
      <stop offset="0%" style="stop-color:#F7D74C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A97C50;stop-opacity:0.8" />
    </radialGradient>
  </defs>

  <g transform="translate(20, 20)">
    <!-- Flower petals -->
    <ellipse cx="0" cy="-10" rx="6" ry="12" fill="url(#petalGradient)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-10" rx="6" ry="12" fill="url(#petalGradient)" transform="rotate(72)"/>
    <ellipse cx="0" cy="-10" rx="6" ry="12" fill="url(#petalGradient)" transform="rotate(144)"/>
    <ellipse cx="0" cy="-10" rx="6" ry="12" fill="url(#petalGradient)" transform="rotate(216)"/>
    <ellipse cx="0" cy="-10" rx="6" ry="12" fill="url(#petalGradient)" transform="rotate(288)"/>

    <!-- Flower center -->
    <circle cx="0" cy="0" r="6" fill="url(#centerGradient)"/>

    <!-- Small dots in center -->
    <circle cx="-2" cy="-2" r="1" fill="#A97C50" opacity="0.6"/>
    <circle cx="2" cy="-2" r="1" fill="#A97C50" opacity="0.6"/>
    <circle cx="0" cy="2" r="1" fill="#A97C50" opacity="0.6"/>
  </g>
</svg>