<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" patternUnits="userSpaceOnUse" patternContentUnits="userSpaceOnUse">
  <defs>
    <pattern id="cloudPattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Cloud shapes -->
      <ellipse cx="30" cy="40" rx="25" ry="15" fill="#D7ECFA" opacity="0.3"/>
      <ellipse cx="50" cy="35" rx="20" ry="12" fill="#D7ECFA" opacity="0.2"/>

      <ellipse cx="150" cy="100" rx="30" ry="18" fill="#D7ECFA" opacity="0.25"/>
      <ellipse cx="170" cy="95" rx="22" ry="14" fill="#D7ECFA" opacity="0.2"/>

      <ellipse cx="80" cy="160" rx="28" ry="16" fill="#D7ECFA" opacity="0.3"/>
      <ellipse cx="100" cy="155" rx="18" ry="11" fill="#D7ECFA" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background with gradient -->
  <rect width="200" height="200" fill="url(#cloudPattern)"/>

  <!-- Subtle flower decorations -->
  <text x="20" y="80" font-family="Arial" font-size="24" fill="#B7D8A8" opacity="0.1">✿</text>
  <text x="140" y="30" font-family="Arial" font-size="18" fill="#B7D8A8" opacity="0.08">✿</text>
  <text x="60" y="140" font-family="Arial" font-size="20" fill="#B7D8A8" opacity="0.09">✿</text>
  <text x="160" y="180" font-family="Arial" font-size="22" fill="#B7D8A8" opacity="0.07">✿</text>
</svg>